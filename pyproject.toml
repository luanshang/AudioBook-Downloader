[project]
name = "audiobook-downloader"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyboard>=0.13",
    "pillow>=10.0",
    "pyside6>=6.6",
    "qrcode>=7.4",
    "requests>=2.31",
]

[project.scripts]
audiobook-downloader = "main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]
