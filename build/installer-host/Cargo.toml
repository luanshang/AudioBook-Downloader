[package]
name = "abk-installer"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Foundation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
